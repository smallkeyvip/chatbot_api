<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI 助手</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root, [data-theme="default"] {
    --bg: #f0f2f5; --surface: #ffffff; --header-bg: #ffffff;
    --user-bubble: #1677ff; --user-text: #ffffff;
    --ai-bubble: #ffffff; --ai-text: #1a1a1a;
    --input-bg: #ffffff; --border: #e8e8e8; --muted: #8c8c8c;
    --accent: #1677ff; --accent-light: #e6f4ff;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --splash-from: #0050d0; --splash-via: #1677ff; --splash-to: #40a9ff;
    --ai-avatar-from: #1677ff; --ai-avatar-to: #40a9ff;
    --user-avatar-from: #52c41a; --user-avatar-to: #73d13d;
  }
  [data-theme="dark"] {
    --bg: #1a1a2e; --surface: #16213e; --header-bg: #0f3460;
    --user-bubble: #e94560; --user-text: #ffffff;
    --ai-bubble: #16213e; --ai-text: #e0e0e0;
    --input-bg: #0f3460; --border: #1a3a6e; --muted: #7a8ba8;
    --accent: #e94560; --accent-light: #2a1a2e;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
    --splash-from: #0f0c29; --splash-via: #302b63; --splash-to: #24243e;
    --ai-avatar-from: #e94560; --ai-avatar-to: #ff6b8a;
    --user-avatar-from: #0f3460; --user-avatar-to: #1a6fb5;
  }
  [data-theme="ocean"] {
    --bg: #e0f7fa; --surface: #ffffff; --header-bg: #006064;
    --user-bubble: #00838f; --user-text: #ffffff;
    --ai-bubble: #ffffff; --ai-text: #1a1a1a;
    --input-bg: #ffffff; --border: #b2ebf2; --muted: #5f9ea0;
    --accent: #00838f; --accent-light: #e0f7fa;
    --shadow: 0 2px 12px rgba(0,97,101,0.12);
    --splash-from: #004d40; --splash-via: #00695c; --splash-to: #00897b;
    --ai-avatar-from: #00838f; --ai-avatar-to: #26c6da;
    --user-avatar-from: #00695c; --user-avatar-to: #4db6ac;
  }
  [data-theme="forest"] {
    --bg: #e8f5e9; --surface: #ffffff; --header-bg: #1b5e20;
    --user-bubble: #2e7d32; --user-text: #ffffff;
    --ai-bubble: #ffffff; --ai-text: #1a1a1a;
    --input-bg: #ffffff; --border: #c8e6c9; --muted: #689f6b;
    --accent: #2e7d32; --accent-light: #e8f5e9;
    --shadow: 0 2px 12px rgba(27,94,32,0.12);
    --splash-from: #1b4332; --splash-via: #2d6a4f; --splash-to: #40916c;
    --ai-avatar-from: #2e7d32; --ai-avatar-to: #66bb6a;
    --user-avatar-from: #5d4037; --user-avatar-to: #8d6e63;
  }
  [data-theme="sunset"] {
    --bg: #fce4ec; --surface: #ffffff; --header-bg: #880e4f;
    --user-bubble: #ad1457; --user-text: #ffffff;
    --ai-bubble: #ffffff; --ai-text: #1a1a1a;
    --input-bg: #ffffff; --border: #f8bbd0; --muted: #c06080;
    --accent: #ad1457; --accent-light: #fce4ec;
    --shadow: 0 2px 12px rgba(136,14,79,0.12);
    --splash-from: #4a148c; --splash-via: #880e4f; --splash-to: #e91e63;
    --ai-avatar-from: #ad1457; --ai-avatar-to: #f06292;
    --user-avatar-from: #6a1b9a; --user-avatar-to: #ab47bc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); height: 100dvh; overflow: hidden;
    transition: background 0.3s;
  }

  /* ===== 启动遮罩 ===== */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(145deg, var(--splash-from), var(--splash-via), var(--splash-to));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #splash .logo {
    width: 80px; height: 80px; border-radius: 24px;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    animation: float 2s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  #splash h1 { color: #fff; font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  #splash p { color: rgba(255,255,255,0.75); font-size: 14px; }
  .splash-card {
    width: 300px; background: rgba(255,255,255,0.15);
    border-radius: 20px; padding: 24px; backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.25);
  }
  .splash-card label {
    color: rgba(255,255,255,0.9); font-size: 12px; font-weight: 500;
    display: block; margin-bottom: 6px; letter-spacing: 0.5px;
  }
  .splash-card input {
    width: 100%; border: none; outline: none;
    background: rgba(255,255,255,0.92); border-radius: 10px;
    padding: 10px 14px; font-size: 15px; font-family: inherit; color: #1a1a1a;
    margin-bottom: 12px;
  }
  .splash-card input:focus { box-shadow: 0 0 0 2px rgba(255,255,255,0.5); }
  .splash-card .hint { color: rgba(255,255,255,0.65); font-size: 12px; margin-bottom: 14px; text-align: center; }
  .splash-card .error { color: #ffcccc; font-size: 12px; margin-bottom: 10px; text-align: center; }
  .splash-card .btn-row { display: flex; gap: 10px; }
  .splash-card button {
    flex: 1; padding: 12px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer; letter-spacing: 1px;
    transition: transform 0.15s, opacity 0.15s;
  }
  .splash-card button:active { transform: scale(0.97); }
  .btn-primary { background: #fff; color: var(--accent); box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
  .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4) !important; }

  /* ===== 浮窗容器 ===== */
  #chat-window {
    position: fixed;
    width: 420px; height: 600px;
    min-width: 320px; min-height: 400px;
    max-width: 100vw; max-height: 100dvh;
    right: 24px; bottom: 24px;
    background: var(--surface);
    border-radius: 20px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: border-radius 0.3s, box-shadow 0.3s;
    z-index: 100;
  }
  #chat-window.fullscreen {
    inset: 0 !important;
    width: 100vw !important; height: 100dvh !important;
    border-radius: 0;
    right: 0; bottom: 0;
  }
  #chat-window.minimized {
    width: 60px !important; height: 60px !important;
    min-width: 60px; min-height: 60px;
    right: 24px; bottom: 24px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  #chat-window.minimized > *:not(#float-bubble) { display: none !important; }
  #float-bubble {
    display: none;
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, var(--ai-avatar-from), var(--ai-avatar-to));
    align-items: center; justify-content: center;
    font-size: 28px; color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    animation: float 2s ease-in-out infinite;
  }
  #chat-window.minimized #float-bubble { display: flex; }

  /* 拖拽条 */
  #drag-handle {
    cursor: grab; user-select: none;
    padding: 6px 0; display: flex; justify-content: center;
  }
  #drag-handle::after {
    content: ''; width: 40px; height: 4px; border-radius: 2px;
    background: var(--border);
  }
  #chat-window.fullscreen #drag-handle { display: none; }
  #chat-window.minimized #drag-handle { display: none; }

  /* 缩放把手 */
  #resize-handle {
    position: absolute; right: 0; bottom: 0;
    width: 20px; height: 20px; cursor: nwse-resize;
    z-index: 10;
  }
  #resize-handle::after {
    content: ''; position: absolute; right: 4px; bottom: 4px;
    width: 10px; height: 10px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    opacity: 0.4;
  }
  #chat-window.fullscreen #resize-handle { display: none; }
  #chat-window.minimized #resize-handle { display: none; }

  /* ===== Header ===== */
  #header {
    background: var(--header-bg); padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 10; transition: background 0.3s;
    flex-shrink: 0;
  }
  #header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--ai-avatar-from), var(--ai-avatar-to));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  #header .info { flex: 1; min-width: 0; }
  #header .title { font-size: 15px; font-weight: 700; color: var(--ai-text); }
  #header .session-label {
    font-size: 11px; color: var(--muted); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .header-actions { display: flex; gap: 6px; align-items: center; }
  .hdr-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: var(--accent-light); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }
  .hdr-btn:active { transform: scale(0.9); }
  .hdr-btn.active-style { background: var(--accent); color: #fff; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #52c41a; flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(82,196,26,0.2);
  }
  .status-dot.offline { background: var(--muted); box-shadow: none; }

  /* 用量指示器 */
  #usage-badge {
    font-size: 10px; color: var(--muted); background: var(--accent-light);
    border-radius: 10px; padding: 2px 6px; white-space: nowrap;
    border: 1px solid var(--border);
  }
  #usage-badge.warn { color: #fa8c16; border-color: #ffd591; background: #fff7e6; }
  #usage-badge.danger { color: #f5222d; border-color: #ffa39e; background: #fff1f0; }

  /* ===== 消息区 ===== */
  #messages {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 12px 10px; display: flex; flex-direction: column; gap: 4px;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
  }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

  .msg-row {
    display: flex; align-items: flex-end; gap: 8px;
    animation: msgIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes msgIn { from{opacity:0;transform:translateY(10px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg-row.ai .msg-avatar { background: linear-gradient(135deg, var(--ai-avatar-from), var(--ai-avatar-to)); }
  .msg-row.user .msg-avatar { background: linear-gradient(135deg, var(--user-avatar-from), var(--user-avatar-to)); }
  .bubble {
    max-width: 75%; padding: 9px 13px; border-radius: 16px;
    font-size: 14px; line-height: 1.6; word-break: break-word;
  }
  .msg-row.ai .bubble {
    background: var(--ai-bubble); color: var(--ai-text);
    border-bottom-left-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .msg-row.user .bubble {
    background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 6px;
  }
  .thinking { display: flex; align-items: center; gap: 4px; padding: 10px 13px; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-6px);opacity:1} }
  .timestamp { text-align: center; font-size: 11px; color: var(--muted); margin: 8px 0; }
  .sys-msg {
    text-align: center; font-size: 12px; color: var(--muted);
    background: rgba(0,0,0,0.05); border-radius: 20px;
    padding: 6px 14px; align-self: center; margin: 6px 0;
  }
  #ended-banner {
    display: none; margin: 8px 12px;
    background: linear-gradient(135deg, #fff7e6, #fff1b8);
    border: 1px solid #ffe58f; border-radius: 14px;
    padding: 12px 14px; text-align: center;
  }
  #ended-banner p { font-size: 12px; color: #8c6914; margin-bottom: 8px; }
  #ended-banner button {
    background: #fa8c16; color: #fff; border: none; border-radius: 10px;
    padding: 7px 18px; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }

  /* ===== 输入区 ===== */
  #input-area {
    background: var(--input-bg); border-top: 1px solid var(--border);
    padding: 8px 10px; display: flex; align-items: flex-end; gap: 6px;
    flex-shrink: 0; transition: background 0.3s;
  }
  #input-wrap {
    flex: 1; background: var(--bg); border-radius: 20px;
    border: 1.5px solid var(--border); display: flex; align-items: center;
    padding: 0 4px 0 12px; transition: border-color 0.2s;
  }
  #input-wrap:focus-within { border-color: var(--accent); }
  #msg-input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; font-family: inherit; color: var(--ai-text);
    padding: 8px 0; line-height: 1.4; resize: none; max-height: 80px; min-height: 20px;
  }
  #msg-input::placeholder { color: var(--muted); }
  #send-btn {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  #send-btn:active { transform: scale(0.93); }
  #send-btn:disabled { background: #d9d9d9; box-shadow: none; cursor: not-allowed; }
  #send-btn svg { width: 18px; height: 18px; fill: #fff; }
  #quick-hint { padding: 4px 10px 2px; display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .quick-chip {
    font-size: 11px; color: var(--muted); background: rgba(0,0,0,0.04);
    border-radius: 10px; padding: 3px 8px; cursor: pointer;
    transition: background 0.15s, color 0.15s; border: 1px solid var(--border);
  }
  .quick-chip:active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ===== 弹窗通用 ===== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 9000;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
  }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  .modal-card {
    width: 360px; max-width: 92vw; max-height: 80vh; overflow-y: auto;
    background: var(--surface); border-radius: 20px; padding: 24px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    transform: scale(0.9) translateY(20px); transition: transform 0.25s;
  }
  .modal-overlay.active .modal-card { transform: scale(1) translateY(0); }
  .modal-card h3 { font-size: 17px; font-weight: 700; color: var(--ai-text); margin-bottom: 16px; }
  .modal-card .close-btn {
    float: right; background: none; border: none; font-size: 20px;
    color: var(--muted); cursor: pointer; margin-top: -4px;
  }

  /* 主题选择 */
  .theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
  .theme-option {
    aspect-ratio: 1; border-radius: 14px; cursor: pointer;
    border: 3px solid transparent; transition: border-color 0.2s, transform 0.15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; font-weight: 600; gap: 2px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .theme-option:active { transform: scale(0.93); }
  .theme-option.selected { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .theme-option[data-t="default"] { background: linear-gradient(135deg, #1677ff, #40a9ff); }
  .theme-option[data-t="dark"] { background: linear-gradient(135deg, #302b63, #e94560); }
  .theme-option[data-t="ocean"] { background: linear-gradient(135deg, #004d40, #26c6da); }
  .theme-option[data-t="forest"] { background: linear-gradient(135deg, #1b4332, #66bb6a); }
  .theme-option[data-t="sunset"] { background: linear-gradient(135deg, #880e4f, #f06292); }

  /* 机器人风格选择 */
  .style-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .style-option {
    border-radius: 14px; cursor: pointer;
    border: 2px solid var(--border); padding: 12px;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg);
  }
  .style-option:active { transform: scale(0.97); }
  .style-option.selected { border-color: var(--accent); background: var(--accent-light); }
  .style-option .style-emoji { font-size: 24px; flex-shrink: 0; }
  .style-option .style-info { flex: 1; }
  .style-option .style-label { font-size: 14px; font-weight: 600; color: var(--ai-text); }
  .style-option .style-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* 反馈表单 */
  .fb-group { margin-bottom: 14px; }
  .fb-group label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .fb-group select, .fb-group input, .fb-group textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 14px; font-family: inherit;
    background: var(--bg); color: var(--ai-text); outline: none; transition: border-color 0.2s;
  }
  .fb-group select:focus, .fb-group input:focus, .fb-group textarea:focus { border-color: var(--accent); }
  .fb-group textarea { resize: vertical; min-height: 80px; }
  .fb-submit {
    width: 100%; padding: 12px; background: var(--accent); color: #fff;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: opacity 0.2s;
  }
  .fb-submit:active { opacity: 0.8; }
  .fb-success { text-align: center; color: #52c41a; font-size: 14px; margin-top: 10px; }

  /* ===== 窗口尺寸预设按钮 ===== */
  .size-presets { display: flex; gap: 6px; margin-top: 12px; justify-content: center; }
  .size-btn {
    padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--ai-text); font-size: 12px; font-weight: 500;
    font-family: inherit; cursor: pointer; transition: all 0.2s;
  }
  .size-btn:hover { border-color: var(--accent); color: var(--accent); }
  .size-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ===== 猜你喜欢 ===== */
  #recommend-area { margin: 6px 2px 10px; animation: msgIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
  #recommend-title { font-size: 12px; color: var(--muted); font-weight: 600; margin: 2px 4px 8px; }
  .recommend-list { display: flex; flex-direction: column; gap: 8px; }
  .recommend-card {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 10px 12px; cursor: pointer;
    font-size: 13px; color: var(--ai-text);
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .recommend-card:active { transform: scale(0.97); }
  .recommend-card:hover { border-color: var(--accent); background: var(--accent-light); }
  .recommend-card .rc-text { flex: 1; line-height: 1.4; }
  .recommend-card .rc-arrow { color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .recommend-skeleton {
    height: 41px; border-radius: 14px; border: 1.5px solid var(--border);
    background: linear-gradient(90deg, var(--border) 25%, var(--surface) 37%, var(--border) 63%);
    background-size: 400% 100%; animation: shimmer 1.2s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  /* ===== 响应式 ===== */
  @media (max-width: 480px) {
    #chat-window {
      inset: 0 !important; width: 100vw !important; height: 100dvh !important;
      right: 0; bottom: 0; border-radius: 0;
    }
    #drag-handle, #resize-handle { display: none; }
  }
</style>
</head>
<body>

<!-- ===== 启动页 ===== -->
<div id="splash">
  <div class="logo">🤖</div>
  <h1>AI 助手</h1>
  <p>智能对话 · 知识沉淀</p>

    <div class="hint" id="login-hint">欢迎回来！</div>
    <div class="error" id="login-error" style="display:none"></div>
    <div class="btn-row">
      <button class="btn-secondary" id="btn-login-back">返回</button>

    <label style="margin-top:4px">确认密码</label>
    <input type="password" id="input-reg-pwd2" placeholder="再次输入密码">
    <div class="hint" id="reg-hint">新用户，欢迎！</div>
    <div class="error" id="reg-error" style="display:none"></div>
    <div class="btn-row">
      <button class="btn-secondary" id="btn-reg-back">返回</button>
      <button class="btn-primary" id="btn-register">注册</button>
    </div>

</div>

<!-- ===== 浮窗聊天窗口 ===== -->
<div id="chat-window">
  <div id="float-bubble">🤖</div>
  <div id="drag-handle"></div>
  <div id="header">
    <div class="avatar" id="header-avatar">🤖</div>
    <div class="info">
      <div class="title">AI 助手</div>
      <div class="session-label" id="header-session">会话加载中...</div>
    </div>
    <div class="header-actions">
      <span id="usage-badge" title="今日用量">0/50</span>
      <button class="hdr-btn" id="btn-bot-style" title="聊天风格">🎭</button>
      <button class="hdr-btn" id="btn-theme" title="界面主题">🎨</button>
      <button class="hdr-btn" id="btn-feedback" title="反馈建议">💬</button>
      <button class="hdr-btn" id="btn-size" title="窗口大小">⛶</button>
      <button class="hdr-btn" id="btn-minimize" title="最小化">─</button>
      <button class="hdr-btn" id="btn-logout" title="退出登录">🚪</button>
    </div>
    <div class="status-dot" id="status-dot"></div>
  </div>

  <div id="messages"></div>

  <div id="ended-banner">
    <p>✅ 本次会话已结束，对话已自动保存到知识库</p>
    <button id="new-session-btn">开始新会话</button>
  </div>

  <div id="quick-hint">
    <span class="quick-chip" data-text="清除">🗑 清除历史</span>
    <span class="quick-chip" data-text="再见">👋 结束会话</span>
  </div>

  <div id="input-area">
    <div id="input-wrap">
      <textarea id="msg-input" rows="1" placeholder="发送消息..."></textarea>
    </div>
    <button id="send-btn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div id="resize-handle"></div>
</div>

<!-- ===== 主题弹窗 ===== -->
<div class="modal-overlay" id="modal-theme">
  <div class="modal-card">
    <button class="close-btn" id="close-theme">✕</button>
    <h3>🎨 界面主题</h3>
    <div class="theme-grid">
      <div class="theme-option" data-t="default"><span>🌤</span><span>默认</span></div>
      <div class="theme-option" data-t="dark"><span>🌙</span><span>暗夜</span></div>
      <div class="theme-option" data-t="ocean"><span>🌊</span><span>海洋</span></div>
      <div class="theme-option" data-t="forest"><span>🌲</span><span>森林</span></div>
      <div class="theme-option" data-t="sunset"><span>🌅</span><span>晚霞</span></div>
    </div>
    <div style="font-size:12px;color:var(--muted);text-align:center">点击切换，自动保存</div>
  </div>
</div>

<!-- ===== 机器人风格弹窗 ===== -->
<div class="modal-overlay" id="modal-bot-style">
  <div class="modal-card">
    <button class="close-btn" id="close-bot-style">✕</button>
    <h3>🎭 聊天风格</h3>
    <div class="style-grid" id="style-grid"></div>
    <div style="font-size:12px;color:var(--muted);text-align:center">选择机器人回复风格，自动保存</div>
  </div>
</div>

<!-- ===== 窗口大小弹窗 ===== -->
<div class="modal-overlay" id="modal-size">
  <div class="modal-card">
    <button class="close-btn" id="close-size">✕</button>
    <h3>⛶ 窗口大小</h3>
    <div class="size-presets" id="size-presets">
      <button class="size-btn" data-w="360" data-h="500">小</button>
      <button class="size-btn active" data-w="420" data-h="600">中</button>
      <button class="size-btn" data-w="520" data-h="700">大</button>
      <button class="size-btn" data-w="0" data-h="0">全屏</button>

    <div style="font-size:12px;color:var(--muted);text-align:center;margin-top:12px">也可以拖拽右下角自由调整</div>
  </div>
</div>

<!-- ===== 反馈弹窗 ===== -->
<div class="modal-overlay" id="modal-feedback">
  <div class="modal-card">
    <button class="close-btn" id="close-feedback">✕</button>
    <h3>💬 反馈与建议</h3>
    <div id="fb-form">
      <div class="fb-group">
        <label>类别</label>
        <select id="fb-category">
          <option value="suggestion">💡 功能建议</option>
          <option value="bug">🐛 Bug 报告</option>
          <option value="feedback">📝 使用反馈</option>
        </select>
      </div>
      <div class="fb-group">
        <label>内容</label>
        <textarea id="fb-content" placeholder="请描述您的建议或反馈..." maxlength="2000"></textarea>
      </div>
      <div class="fb-group">
        <label>联系方式（可选）</label>
        <input type="text" id="fb-contact" placeholder="邮箱或手机号" maxlength="100">
      </div>
      <button class="fb-submit" id="btn-fb-submit">提交反馈</button>
      <div class="fb-success" id="fb-success" style="display:none"></div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let sessionId = '';
let username = '';
let isEnded = false;
let isFullscreen = false;
let isMinimized = false;
let currentBotStyle = 'default';
let hasEnteredChat = false;  // 防止自动登录与手动操作重复进入聊天

const $ = id => document.getElementById(id);
const chatWin = $('chat-window');
const msgs = $('messages');

// ==================== 工具函数 ====================
function formatTime(d) {
  d = d || new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 80) + 'px'; }
function scrollBottom(smooth) {
  setTimeout(() => msgs.scrollTo({ top: msgs.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }), 50);
}
function showError(elId, msg) { const el = $(elId); el.textContent = msg; el.style.display = 'block'; }
function hideError(elId) { $(elId).style.display = 'none'; }

// ==================== API 请求封装 ====================
async function apiPost(path, body) {
  const res = await fetch(API + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}
async function apiGet(path) {
  const res = await fetch(API + path);
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

// ==================== 自动登录（5分钟免密） ====================
const AUTO_LOGIN_KEY = 'chatbot_auto_login';

function saveAutoLogin(data) {
  if (!data || !data.auto_login_token || !data.username) return;
  try {
    localStorage.setItem(AUTO_LOGIN_KEY, JSON.stringify({
      token: data.auto_login_token,
      username: data.username,
      expireAt: Date.now() + (data.auto_login_expires_in || 300) * 1000,
    }));
  } catch(e) {}
}
function loadAutoLogin() {
  try {
    const raw = localStorage.getItem(AUTO_LOGIN_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    return (obj && obj.token && obj.username) ? obj : null;
  } catch(e) { return null; }
}
function clearAutoLogin() { try { localStorage.removeItem(AUTO_LOGIN_KEY); } catch(e) {} }

// 尝试用本地凭证免密登录；成功则直接进入聊天
async function tryAutoLogin(showHint) {
  const saved = loadAutoLogin();
  if (!saved) return false;
  // 本地已过期即弃，减少无效请求
  if (saved.expireAt && Date.now() > saved.expireAt) { clearAutoLogin(); return false; }
  if (showHint) $('username-hint').textContent = `检测到 ${saved.username} 的登录记录，正在自动登录...`;
  try {
    const { ok, data } = await apiPost('/auth/auto-login', { token: saved.token });
    if (ok && data.username && !hasEnteredChat) {
      username = data.username;
      // 滑动窗口：本地同步续期
      saveAutoLogin({ auto_login_token: saved.token, username: data.username, auto_login_expires_in: 300 });
      enterChat({ autoLogin: true });
      return true;
    }
  } catch(e) {}
  clearAutoLogin();
  if (showHint) $('username-hint').textContent = '相同用户名可延续历史对话';
  return false;
}

// ==================== 认证流程 ====================
$('btn-check-user').addEventListener('click', checkUser);
$('input-username').addEventListener('keydown', e => { if (e.key === 'Enter') checkUser(); });

async function checkUser() {
  const val = $('input-username').value.trim();
  if (!val) { showError('username-error', '请输入用户名'); return; }
  hideError('username-error');
  $('btn-check-user').textContent = '检查中...';
  try {
    const { ok, data } = await apiPost('/auth/check', { username: val });
    $('btn-check-user').textContent = '继续';
    if (!ok) { showError('username-error', data.detail || '请求失败'); return; }
    username = val;
    if (data.exists) {
      // 5 分钟内登录过该用户 → 免密自动登录，跳过密码输入
      const saved = loadAutoLogin();
      if (saved && saved.username === val && saved.expireAt > Date.now()) {
        $('btn-check-user').textContent = '自动登录中...';
        const r = await apiPost('/auth/auto-login', { token: saved.token }).catch(() => ({ ok: false }));
        $('btn-check-user').textContent = '继续';
        if (r.ok && r.data && r.data.username) {
          saveAutoLogin({ auto_login_token: saved.token, username: r.data.username, auto_login_expires_in: 300 });
          enterChat({ autoLogin: true });
          return;
        }
        clearAutoLogin(); // 凭证已失效，走正常密码流程
      }
      $('card-username').style.display = 'none';
      $('card-login').style.display = 'block';
      $('login-hint').textContent = `欢迎回来，${val}！`;
      $('input-login-pwd').focus();
    } else {
      $('card-username').style.display = 'none';
      $('card-register').style.display = 'block';
      $('reg-hint').textContent = `新用户 ${val}，请设置密码`;
      $('input-reg-pwd').focus();
    }
  } catch(e) {
    $('btn-check-user').textContent = '继续';
    showError('username-error', '网络错误，请检查服务');
  }
}

$('btn-login-back').addEventListener('click', () => {
  $('card-login').style.display = 'none'; $('card-username').style.display = 'block';
  $('input-login-pwd').value = '';
});
$('btn-reg-back').addEventListener('click', () => {
  $('card-register').style.display = 'none'; $('card-username').style.display = 'block';
  $('input-reg-pwd').value = ''; $('input-reg-pwd2').value = '';
});

$('btn-login').addEventListener('click', doLogin);
$('input-login-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
async function doLogin() {
  const pwd = $('input-login-pwd').value;
  if (!pwd) { showError('login-error', '请输入密码'); return; }
  hideError('login-error');
  $('btn-login').textContent = '登录中...';
  try {
    const { ok, status, data } = await apiPost('/auth/login', { username, password: pwd });
    $('btn-login').textContent = '登录';
    if (!ok) { showError('login-error', data.detail || (status === 401 ? '密码错误' : '登录失败')); return; }
    saveAutoLogin(data);
    enterChat();
  } catch(e) { $('btn-login').textContent = '登录'; showError('login-error', '网络错误'); }
}

$('btn-register').addEventListener('click', doRegister);
async function doRegister() {
  const pwd = $('input-reg-pwd').value;
  const pwd2 = $('input-reg-pwd2').value;
  if (!pwd || pwd.length < 6) { showError('reg-error', '密码至少6位'); return; }
  if (pwd !== pwd2) { showError('reg-error', '两次密码不一致'); return; }
  hideError('reg-error');
  $('btn-register').textContent = '注册中...';
  try {
    const { ok, data } = await apiPost('/auth/register', { username, password: pwd });
    $('btn-register').textContent = '注册';
    if (!ok) { showError('reg-error', data.detail || '注册失败'); return; }
    saveAutoLogin(data);
    enterChat();
  } catch(e) { $('btn-register').textContent = '注册'; showError('reg-error', '网络错误'); }
}

// ==================== 进入聊天 ====================
async function enterChat(opts) {
  if (hasEnteredChat) return;  // 防止自动登录与手动操作重复进入
  hasEnteredChat = true;
  const fromAutoLogin = !!(opts && opts.autoLogin);
  sessionId = username;
  $('splash').classList.add('hidden');
  $('header-session').textContent = '👤 ' + username;

  // 恢复窗口尺寸
  const savedSize = localStorage.getItem('chatWinSize');
  if (savedSize) {
    try {
      const { w, h } = JSON.parse(savedSize);
      if (w === 0) { toggleFullscreen(true); }
      else { chatWin.style.width = w + 'px'; chatWin.style.height = h + 'px'; }
    } catch(e) {}
  }

  // 加载主题
  try {
    const { ok, data } = await apiGet('/auth/theme?username=' + encodeURIComponent(username));
    if (ok) applyTheme(data.theme || 'default');
  } catch(e) { applyTheme('default'); }

  // 加载机器人风格
  try {
    const { ok, data } = await apiGet('/auth/bot-style?username=' + encodeURIComponent(username));
    if (ok) { currentBotStyle = data.current || 'default'; }
  } catch(e) {}

  refreshUsage();
  appendTimestamp('今天 ' + formatTime());
  appendBubble('ai', `你好，${username}！我是 AI 助手，有什么可以帮你的？😊\n\n发送「再见」可结束会话并自动保存，发送「清除」可清空历史记录。\n点击右上角 🎭 可切换我的聊天风格哦～`);
  if (fromAutoLogin) appendSys('🔓 已自动登录（5 分钟内免密）');
  scrollBottom(false);

  // 首页工作台：加载「猜你喜欢」推荐问题
  loadRecommendations();
}

// ==================== 主题切换 ====================
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-option').forEach(el => {
    el.classList.toggle('selected', el.dataset.t === theme);
  });
}
$('btn-theme').addEventListener('click', () => $('modal-theme').classList.add('active'));
$('close-theme').addEventListener('click', () => $('modal-theme').classList.remove('active'));
$('modal-theme').addEventListener('click', e => { if (e.target === $('modal-theme')) $('modal-theme').classList.remove('active'); });
document.querySelectorAll('.theme-option').forEach(el => {
  el.addEventListener('click', async () => {
    applyTheme(el.dataset.t);
    try { await apiPost('/auth/theme', { username, theme: el.dataset.t }); } catch(e) {}
  });
});

// ==================== 机器人风格 ====================
async function loadBotStyles() {
  try {
    const { ok, data } = await apiGet('/auth/bot-style?username=' + encodeURIComponent(username));
    if (!ok) return;
    currentBotStyle = data.current || 'default';
    const grid = $('style-grid');
    grid.innerHTML = '';
    (data.items || []).forEach(item => {
      const div = document.createElement('div');
      div.className = 'style-option' + (item.key === currentBotStyle ? ' selected' : '');
      div.dataset.style = item.key;
      div.innerHTML = `<span class="style-emoji">${item.emoji}</span><div class="style-info"><div class="style-label">${item.label}</div><div class="style-desc">${item.desc}</div></div>`;
      div.addEventListener('click', async () => {
        document.querySelectorAll('.style-option').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        currentBotStyle = item.key;
        try { await apiPost('/auth/bot-style', { username, bot_style: item.key }); } catch(e) {}
      });
      grid.appendChild(div);
    });
  } catch(e) {}
}
$('btn-bot-style').addEventListener('click', () => {
  loadBotStyles();
  $('modal-bot-style').classList.add('active');
});
$('close-bot-style').addEventListener('click', () => $('modal-bot-style').classList.remove('active'));
$('modal-bot-style').addEventListener('click', e => { if (e.target === $('modal-bot-style')) $('modal-bot-style').classList.remove('active'); });

// ==================== 窗口大小控制 ====================
$('btn-size').addEventListener('click', () => {
  // 更新当前选中状态
  document.querySelectorAll('.size-btn').forEach(btn => {
    const w = parseInt(btn.dataset.w);
    const h = parseInt(btn.dataset.h);
    const curW = chatWin.offsetWidth;
    const curH = chatWin.offsetHeight;
    btn.classList.toggle('active', w === 0 ? isFullscreen : (!isFullscreen && Math.abs(curW - w) < 10 && Math.abs(curH - h) < 10));
  });
  $('modal-size').classList.add('active');
});
$('close-size').addEventListener('click', () => $('modal-size').classList.remove('active'));
$('modal-size').addEventListener('click', e => { if (e.target === $('modal-size')) $('modal-size').classList.remove('active'); });

document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const w = parseInt(btn.dataset.w);
    const h = parseInt(btn.dataset.h);
    if (w === 0) {
      toggleFullscreen(true);
    } else {
      toggleFullscreen(false);
      chatWin.style.width = w + 'px';
      chatWin.style.height = h + 'px';
    }
    localStorage.setItem('chatWinSize', JSON.stringify({ w, h }));
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    $('modal-size').classList.remove('active');
  });
});

function toggleFullscreen(on) {
  isFullscreen = on;
  chatWin.classList.toggle('fullscreen', on);
  if (on) {
    chatWin.style.cssText = '';
  }
}

// ==================== 最小化 / 恢复 ====================
$('btn-minimize').addEventListener('click', () => {
  isMinimized = true;
  chatWin.classList.add('minimized');
});
$('float-bubble').addEventListener('click', () => {
  isMinimized = false;
  chatWin.classList.remove('minimized');
});

// ==================== 拖拽移动 ====================
let isDragging = false, dragOffX = 0, dragOffY = 0;
$('drag-handle').addEventListener('mousedown', e => {
  if (isFullscreen || isMinimized) return;
  isDragging = true;
  const rect = chatWin.getBoundingClientRect();
  dragOffX = e.clientX - rect.left;
  dragOffY = e.clientY - rect.top;
  document.body.style.cursor = 'grabbing';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  let x = e.clientX - dragOffX;
  let y = e.clientY - dragOffY;
  x = Math.max(0, Math.min(x, window.innerWidth - chatWin.offsetWidth));
  y = Math.max(0, Math.min(y, window.innerHeight - chatWin.offsetHeight));
  chatWin.style.left = x + 'px'; chatWin.style.top = y + 'px';
  chatWin.style.right = 'auto'; chatWin.style.bottom = 'auto';
});
document.addEventListener('mouseup', () => {
  if (isDragging) { isDragging = false; document.body.style.cursor = ''; }
  if (isResizing) { isResizing = false; document.body.style.cursor = ''; }
});

// 触摸拖拽
$('drag-handle').addEventListener('touchstart', e => {
  if (isFullscreen || isMinimized) return;
  isDragging = true;
  const rect = chatWin.getBoundingClientRect();
  const t = e.touches[0];
  dragOffX = t.clientX - rect.left;
  dragOffY = t.clientY - rect.top;
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (!isDragging && !isResizing) return;
  const t = e.touches[0];
  if (isDragging) {
    let x = t.clientX - dragOffX;
    let y = t.clientY - dragOffY;
    x = Math.max(0, Math.min(x, window.innerWidth - chatWin.offsetWidth));
    y = Math.max(0, Math.min(y, window.innerHeight - chatWin.offsetHeight));
    chatWin.style.left = x + 'px'; chatWin.style.top = y + 'px';
    chatWin.style.right = 'auto'; chatWin.style.bottom = 'auto';
  }
  if (isResizing) {
    const rect = chatWin.getBoundingClientRect();
    const nw = Math.max(320, t.clientX - rect.left);
    const nh = Math.max(400, t.clientY - rect.top);
    chatWin.style.width = nw + 'px'; chatWin.style.height = nh + 'px';
  }
}, { passive: false });
document.addEventListener('touchend', () => {
  if (isDragging) { isDragging = false; }
  if (isResizing) { isResizing = false; }
});

// ==================== 拖拽缩放 ====================
let isResizing = false;
$('resize-handle').addEventListener('mousedown', e => {
  if (isFullscreen || isMinimized) return;
  isResizing = true;
  document.body.style.cursor = 'nwse-resize';
  e.preventDefault(); e.stopPropagation();
});
document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  const rect = chatWin.getBoundingClientRect();
  const nw = Math.max(320, Math.min(e.clientX - rect.left, window.innerWidth - rect.left));
  const nh = Math.max(400, Math.min(e.clientY - rect.top, window.innerHeight - rect.top));
  chatWin.style.width = nw + 'px'; chatWin.style.height = nh + 'px';
});
$('resize-handle').addEventListener('touchstart', e => {
  if (isFullscreen || isMinimized) return;
  isResizing = true;
  e.preventDefault(); e.stopPropagation();
}, { passive: false });

// ==================== 反馈 ====================
$('btn-feedback').addEventListener('click', () => {
  $('modal-feedback').classList.add('active');
  $('fb-success').style.display = 'none';
  $('btn-fb-submit').disabled = false;
});
$('close-feedback').addEventListener('click', () => $('modal-feedback').classList.remove('active'));
$('modal-feedback').addEventListener('click', e => { if (e.target === $('modal-feedback')) $('modal-feedback').classList.remove('active'); });
$('btn-fb-submit').addEventListener('click', async () => {
  const content = $('fb-content').value.trim();
  if (!content) { alert('请输入反馈内容'); return; }
  $('btn-fb-submit').disabled = true;
  $('btn-fb-submit').textContent = '提交中...';
  try {
    const { ok, data } = await apiPost('/feedback/submit', {
      username, category: $('fb-category').value,
      content, contact: $('fb-contact').value,
    });
    $('btn-fb-submit').textContent = '提交反馈';
    $('btn-fb-submit').disabled = false;
    if (ok) {
      $('fb-success').textContent = '✅ ' + (data.message || '感谢您的反馈！');
      $('fb-success').style.display = 'block';
      $('fb-content').value = ''; $('fb-contact').value = '';
      setTimeout(() => $('modal-feedback').classList.remove('active'), 1500);
    } else { alert(data.detail || '提交失败'); }
  } catch(e) {
    $('btn-fb-submit').textContent = '提交反馈';
    $('btn-fb-submit').disabled = false;
    alert('网络错误');
  }
});

// ==================== 用量 ====================
async function refreshUsage() {
  try {
    const { ok, data } = await apiGet('/auth/usage?username=' + encodeURIComponent(username));
    if (ok) updateUsageBadge(data);
  } catch(e) {}
}
function updateUsageBadge(data) {
  const badge = $('usage-badge');
  const used = data.daily_chat_used || 0;
  const limit = data.daily_chat_limit || 50;
  badge.textContent = used + '/' + limit;
  badge.className = '';
  const ratio = used / limit;
  if (ratio >= 0.9) badge.classList.add('danger');
  else if (ratio >= 0.7) badge.classList.add('warn');
  badge.title = `对话 ${used}/${limit} | Token ${data.daily_tokens_used || 0}/${data.daily_token_limit || 100000}`;
}

// ==================== 退出登录 ====================
$('btn-logout').addEventListener('click', async () => {
  if (!confirm('确定退出登录？')) return;
  const saved = loadAutoLogin();
  if (saved) { try { await apiPost('/auth/logout', { token: saved.token }); } catch(e) {} }
  clearAutoLogin();
  location.reload();
});

// ==================== 消息渲染 ====================
function appendTimestamp(text) {
  const d = document.createElement('div'); d.className = 'timestamp';
  d.textContent = text || formatTime(); msgs.appendChild(d);
}
function appendSys(text) {
  const d = document.createElement('div'); d.className = 'msg-row';
  const s = document.createElement('div'); s.className = 'sys-msg';
  s.textContent = text; d.appendChild(s); msgs.appendChild(d); scrollBottom(true);
}
function appendBubble(role, text) {
  const row = document.createElement('div'); row.className = `msg-row ${role}`;
  const av = document.createElement('div'); av.className = 'msg-avatar';
  av.textContent = role === 'ai' ? '🤖' : '🙂';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  bubble.innerHTML = text.replace(/\n/g, '<br>').replace(/```([\s\S]*?)```/g,
    '<pre style="background:rgba(0,0,0,0.06);padding:8px;border-radius:8px;overflow-x:auto;font-size:13px;margin-top:4px">$1</pre>');
  row.appendChild(av); row.appendChild(bubble); msgs.appendChild(row); scrollBottom(true);
  return row;
}
function showThinking() {
  const row = document.createElement('div'); row.className = 'msg-row ai'; row.id = 'thinking-row';
  const av = document.createElement('div'); av.className = 'msg-avatar'; av.textContent = '🤖';
  const bubble = document.createElement('div'); bubble.className = 'bubble thinking';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(av); row.appendChild(bubble); msgs.appendChild(row); scrollBottom(true);
  return row;
}
function removeThinking() { const el = $('thinking-row'); if (el) el.remove(); }

// ==================== 会话结束 ====================
function handleEnded() {
  isEnded = true;
  $('send-btn').disabled = true; $('msg-input').disabled = true;
  $('ended-banner').style.display = 'block';
  $('status-dot').className = 'status-dot offline';
  appendSys('🔒 会话已结束'); scrollBottom(true);
}

// ==================== 发送消息 ====================
async function sendMessage(text) {
  if (!text.trim() || isEnded) return false;
  $('msg-input').value = ''; $('msg-input').style.height = 'auto';
  $('send-btn').disabled = true;
  appendBubble('user', text);

  if (text.trim() === '清除') {
    showThinking();
    try {
      const { ok, data } = await apiPost('/chat/clear', { session_id: sessionId });
      removeThinking();
      if (ok) appendSys('🗑 ' + data.message);
    } catch(e) { removeThinking(); appendSys('⚠️ 网络错误'); }
    $('send-btn').disabled = false; return true;
  }

  let success = false;
  showThinking();
  try {
    const res = await fetch(API + '/chat/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    removeThinking();
    if (res.status === 429) {
      const err = await res.json().catch(() => ({}));
      const detail = err.detail || {};
      appendBubble('ai', '⚠️ ' + (detail.message || '今日用量已达上限，请明天再试或升级付费版'));
      if (detail.daily_chat_used !== undefined) {
        updateUsageBadge({
          daily_chat_used: detail.daily_chat_used, daily_chat_limit: detail.daily_chat_limit,
          daily_tokens_used: detail.daily_tokens_used, daily_token_limit: detail.daily_token_limit,
        });
      }
    } else if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      appendBubble('ai', '⚠️ 请求失败：' + (err.detail || res.status));
    } else {
      const data = await res.json();
      appendBubble('ai', data.reply || '（无回复）');
      if (data.daily_chat_used !== undefined) updateUsageBadge(data);
      if (data.exited) handleEnded();
      success = true;
    }
  } catch(e) {
    removeThinking();
    appendBubble('ai', '⚠️ 无法连接服务，请确认后端已启动');
  }
  if (!isEnded) $('send-btn').disabled = false;
  return success;
}

// ==================== 猜你喜欢（首页工作台推荐） ====================
async function loadRecommendations() {
  if (isEnded || !sessionId) return;
  const area = document.createElement('div');
  area.id = 'recommend-area';
  const title = document.createElement('div');
  title.id = 'recommend-title';
  title.textContent = '✨ 猜你喜欢';
  area.appendChild(title);

  // 骨架加载态
  const skList = document.createElement('div');
  skList.className = 'recommend-list';
  for (let i = 0; i < 4; i++) {
    const sk = document.createElement('div');
    sk.className = 'recommend-skeleton';
    skList.appendChild(sk);
  }
  area.appendChild(skList);
  msgs.appendChild(area);
  scrollBottom(true);

  try {
    const { ok, data } = await apiGet('/chat/recommendations?session_id=' + encodeURIComponent(sessionId));
    // 失败或空结果静默移除，不打扰用户
    if (!ok || !data.items || !data.items.length) { area.remove(); return; }
    renderRecommendCards(area, data);
  } catch(e) { area.remove(); }
}

function renderRecommendCards(area, data) {
  const icons = ['💬', '🔍', '📚', '🚀', '🧠', '✍️'];
  area.innerHTML = '';
  const title = document.createElement('div');
  title.id = 'recommend-title';
  title.textContent = data.source === 'default' ? '💡 试试这些问题' : '✨ 猜你喜欢';
  area.appendChild(title);

  const list = document.createElement('div');
  list.className = 'recommend-list';
  (data.items || []).forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'recommend-card';
    const icon = document.createElement('span');
    icon.textContent = icons[i % icons.length];
    const text = document.createElement('span');
    text.className = 'rc-text';
    text.textContent = item.question;
    const arrow = document.createElement('span');
    arrow.className = 'rc-arrow';
    arrow.textContent = '➤';
    card.appendChild(icon); card.appendChild(text); card.appendChild(arrow);
    card.addEventListener('click', async () => {
      if (isEnded) return;
      area.style.display = 'none';  // 先收起，发送失败可恢复
      // 自动输入并立即提交
      $('msg-input').value = item.question;
      autoResize($('msg-input'));
      const sent = await sendMessage(item.question);
      if (sent) area.remove(); else area.style.display = '';
    });
    list.appendChild(card);
  });
  area.appendChild(list);
  scrollBottom(true);
}

// ==================== 事件绑定 ====================
$('send-btn').addEventListener('click', () => sendMessage($('msg-input').value));
$('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage($('msg-input').value); }
});
$('msg-input').addEventListener('input', function() {
  autoResize(this); $('send-btn').disabled = !this.value.trim() || isEnded;
});
$('new-session-btn').addEventListener('click', () => location.reload());
document.querySelectorAll('.quick-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    if (isEnded) return;
    $('msg-input').value = chip.dataset.text;
    autoResize($('msg-input')); sendMessage(chip.dataset.text);
  });
});
$('send-btn').disabled = true;
$('msg-input').addEventListener('input', function() {
  $('send-btn').disabled = !this.value.trim() || isEnded;
});

// ==================== 启动 ====================
(async () => {
  // 优先尝试 5 分钟免密自动登录，失败则显示用户名输入
  const ok = await tryAutoLogin(true);
  if (!ok) $('input-username').focus();
})();
</script>
